[project]
name = "benchmarks"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Reid Taylor", email = "rebridgers@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chembl-webresource-client>=0.10.9",
    "deepchem>=2.8.0",
    "ipykernel>=7.3.0",
    "json2vec>=0.4.11",
    "pandas>=3.0.5",
    "pdbfixer>=1.12.0",
    "polars>=1.43.2",
    "relbench>=2.1.2",
    "relflow @ git+https://github.com/relflow/relflow.git",
    "requests>=2.34.2",
    "torch>=2.13.0",
    "wandb>=0.28.1",
]

[project.scripts]
benchmarks = "benchmarks:main"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"
